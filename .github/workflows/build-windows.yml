name: Build Running_Task for Windows

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

jobs:
  build-windows:
    name: Verify and package Windows release
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JavaScript build dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

      - name: Verify source, interface, data rules, and release configuration
        run: npm run verify

      - name: Test persistence, migration, and backup layer
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build current-user NSIS setup executable
        run: npm exec -- tauri build --bundles nsis

      - name: Prepare installer, portable package, compatibility check, preview, and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS setup executable was not produced." }

          $desktopExe = @(
            "src-tauri/target/release/running_task.exe",
            "src-tauri/target/release/Running_Task.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $desktopExe) { throw "Desktop executable was not produced." }

          ./scripts/Build-ReleaseAssets.ps1 `
            -InstallerPath $installer.FullName `
            -ExecutablePath (Resolve-Path $desktopExe).Path `
            -ProjectRoot $PWD `
            -OutputDirectory (Join-Path $PWD "release")

      - name: Upload ready-to-use Windows files
        uses: actions/upload-artifact@v7
        with:
          name: Running_Task-Windows-${{ github.run_number }}
          path: |
            release/Running_Task-*-Windows-x64-Setup.exe
            release/Running_Task-*-Windows-x64-Portable.zip
            release/Running_Task-*-Company-PC-Check.zip
            release/Running_Task-*-Preview.html
            release/Running_Task-*-START_HERE.txt
            release/Running_Task-*-LAUNCH_GUIDE.md
            release/Running_Task-*-RELEASE_NOTES.md
            release/SHA256SUMS.txt
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated dependency lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: Running_Task-Build-Lockfiles-${{ github.run_number }}
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30

  publish-tagged-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: Running_Task-Windows-${{ github.run_number }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Running_Task $GITHUB_REF_NAME" \
            --generate-notes
