name: Build Running_Task 1.0 RC for Windows

"on":
  workflow_dispatch:
  push:
    branches:
      - "release/v1.0.0-rc.1"

jobs:
  build-windows-rc:
    name: Reconstruct, verify, and package v1.0.0-rc.1
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out release-candidate bootstrap
        uses: actions/checkout@v6

      - name: Reconstruct approved 0.3 source and apply verified RC patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "_source" -Force | Out-Null

          $baseEncoded = (Get-ChildItem "source-parts/part-*.b64" |
            Sort-Object Name |
            ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes(
            "Running_Task-0.3.0-alpha.3-source.tar.xz",
            [Convert]::FromBase64String($baseEncoded)
          )

          $baseExpected = ((Get-Content "source-parts/SHA256SUMS.txt" -Raw).Trim() -split "\s+")[0]
          $baseActual = (Get-FileHash "Running_Task-0.3.0-alpha.3-source.tar.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseActual -ne $baseExpected.ToLowerInvariant()) {
            throw "Approved baseline checksum mismatch. Expected $baseExpected but found $baseActual."
          }

          tar -xJf "Running_Task-0.3.0-alpha.3-source.tar.xz" -C "_source"
          if (-not (Test-Path "_source/package.json")) {
            throw "The approved baseline source did not reconstruct correctly."
          }

          $patchEncoded = (Get-ChildItem "rc-patch/part-*.b64" |
            Sort-Object Name |
            ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes(
            "rc-from-0.3.patch.xz",
            [Convert]::FromBase64String($patchEncoded)
          )

          $patchExpected = ((Get-Content "rc-patch/SHA256SUMS.txt" -Raw).Trim() -split "\s+")[0]
          $patchActual = (Get-FileHash "rc-from-0.3.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchActual -ne $patchExpected.ToLowerInvariant()) {
            throw "Release-candidate patch checksum mismatch. Expected $patchExpected but found $patchActual."
          }

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            throw "7-Zip is not available on this Windows runner."
          }
          & $sevenZip.Source x "rc-from-0.3.patch.xz" "-o$PWD" -y | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "rc-from-0.3.patch")) {
            throw "The release-candidate patch could not be decompressed."
          }

          # The approved source archive intentionally preserves CRLF for PowerShell
          # files. Git patches are normalized to LF, so normalize those files before
          # checking and applying the release-candidate patch.
          Get-ChildItem "_source" -Recurse -File -Filter "*.ps1" | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            if ($text.Contains("`r`n")) {
              [IO.File]::WriteAllText(
                $_.FullName,
                $text.Replace("`r`n", "`n"),
                [Text.UTF8Encoding]::new($false)
              )
            }
          }

          git -C "_source" apply --check "../rc-from-0.3.patch"
          git -C "_source" apply "../rc-from-0.3.patch"

          $version = (Get-Content "_source/VERSION" -Raw).Trim()
          if ($version -ne "1.0.0-rc.1") {
            throw "The reconstructed source reports version '$version' instead of 1.0.0-rc.1."
          }

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "_source/src-tauri -> target"

      - name: Install JavaScript build dependencies
        working-directory: _source
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

      - name: Verify source, interface, data rules, and release configuration
        working-directory: _source
        run: npm run verify

      - name: Build current-user NSIS setup executable
        working-directory: _source
        run: npm exec -- tauri build --bundles nsis

      - name: Prepare installer, portable package, compatibility check, preview, and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "_source/src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS setup executable was not produced." }

          $desktopExe = @(
            "_source/src-tauri/target/release/running_task.exe",
            "_source/src-tauri/target/release/Running_Task.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $desktopExe) { throw "Desktop executable was not produced." }

          ./_source/scripts/Build-ReleaseAssets.ps1 `
            -InstallerPath $installer.FullName `
            -ExecutablePath (Resolve-Path $desktopExe).Path `
            -ProjectRoot (Resolve-Path "_source").Path `
            -OutputDirectory (Join-Path $PWD "release")

      - name: Upload ready-to-use Windows release candidate
        uses: actions/upload-artifact@v7
        with:
          name: Running_Task-1.0.0-rc.1-Windows-${{ github.run_number }}
          path: |
            release/Running_Task-*-Windows-x64-Setup.exe
            release/Running_Task-*-Windows-x64-Portable.zip
            release/Running_Task-*-Company-PC-Check.zip
            release/Running_Task-*-Preview.html
            release/Running_Task-*-START_HERE.txt
            release/Running_Task-*-LAUNCH_GUIDE.md
            release/Running_Task-*-RELEASE_NOTES.md
            release/SHA256SUMS.txt
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated dependency lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: Running_Task-1.0.0-rc.1-Lockfiles-${{ github.run_number }}
          path: |
            _source/package-lock.json
            _source/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30
